<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Soft Blush Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>

    <!-- Mom Hair Gradient (Natural Dark Espresso) -->
    <linearGradient id="momHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261A15"/>
      <stop offset="100%" stop-color="#140E0C"/>
    </linearGradient>

    <!-- Baby Curly Hair Gradient (Warm Chestnut Brown) -->
    <linearGradient id="babyHairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54331C"/>
      <stop offset="100%" stop-color="#3B2213"/>
    </linearGradient>

    <!-- Avocado Puree Gradient -->
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="107" fill="none" stroke="#FDA4AF" stroke-width="6" opacity="0.6"/>

  <!-- Love Hearts -->
  <path d="M 370 120 C 370 100 395 90 405 105 C 415 90 440 100 440 120 C 440 145 405 165 405 165 C 405 165 370 145 370 120 Z" fill="#FB7185"/>
  <path d="M 425 90 C 425 78 440 72 446 81 C 452 72 467 78 467 90 C 467 105 446 117 446 117 C 446 117 425 105 425 90 Z" fill="#FDA4AF"/>

  <!-- ================= MOMMA ================= -->
  <!-- Mom Shirt (Lavender) -->
  <path d="M 60 480 Q 80 340 190 340 Q 280 340 300 480 Z" fill="#818CF8"/>
  <path d="M 150 340 Q 185 370 220 340 Z" fill="#8C5335"/>

  <!-- Mom Neck & Head (Rich Warm Brown) -->
  <rect x="165" y="270" width="40" height="50" rx="10" fill="#8C5335"/>
  <circle cx="185" cy="220" r="65" fill="#8C5335"/>

  <!-- Mom Hair (Natural High Bun & Soft Curls) -->
  <circle cx="120" cy="170" r="38" fill="url(#momHairGrad)"/>
  <circle cx="145" cy="140" r="32" fill="url(#momHairGrad)"/>
  <circle cx="175" cy="135" r="34" fill="url(#momHairGrad)"/>
  <circle cx="210" cy="145" r="30" fill="url(#momHairGrad)"/>
  <path d="M 120 205 C 115 145 255 140 250 205 C 250 215 245 235 238 245 C 220 215 215 180 185 180 C 155 180 140 215 130 235 Z" fill="url(#momHairGrad)"/>

  <!-- Mom Face Details -->
  <path d="M 160 215 Q 170 205 180 215" fill="none" stroke="#261A15" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 195 215 Q 205 205 215 215" fill="none" stroke="#261A15" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="155" cy="228" r="9" fill="#B45309" opacity="0.6"/>
  <circle cx="215" cy="228" r="9" fill="#B45309" opacity="0.6"/>
  <path d="M 174 238 Q 187 254 201 238" fill="none" stroke="#451A03" stroke-width="4" stroke-linecap="round"/>

  <!-- ================= BABY ================= -->
  <!-- Baby Bib (Fresh Mint) -->
  <path d="M 280 480 Q 300 370 390 370 Q 470 370 485 480 Z" fill="#6EE7B7"/>

  <!-- Baby Head (Warm Golden Caramel) -->
  <circle cx="380" cy="290" r="58" fill="#DDA177"/>

  <!-- Baby Cheerful Eyes & Smile -->
  <path d="M 350 285 Q 360 275 370 285" fill="none" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
  <path d="M 390 285 Q 400 275 410 285" fill="none" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
  <path d="M 370 305 Q 380 328 390 305 Z" fill="#E11D48"/>
  <circle cx="348" cy="298" r="8" fill="#F87171" opacity="0.7"/>
  <circle cx="412" cy="298" r="8" fill="#F87171" opacity="0.7"/>

  <!-- Baby Curly Hair Tufts -->
  <circle cx="370" cy="232" r="10" fill="url(#babyHairGrad)"/>
  <circle cx="383" cy="228" r="12" fill="url(#babyHairGrad)"/>
  <circle cx="396" cy="233" r="9" fill="url(#babyHairGrad)"/>

  <!-- ================= FEEDING SPOON & BOWL ================= -->
  <!-- Mom Arm holding spoon -->
  <path d="M 215 370 Q 280 360 330 330" fill="none" stroke="#8C5335" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Baby Silicone Spoon (Teal) -->
  <path d="M 320 335 L 360 315" fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="362" cy="314" rx="10" ry="7" fill="#0D9488"/>
  <ellipse cx="363" cy="313" rx="7" ry="4" fill="url(#foodGrad)"/>

  <!-- Food Suction Bowl -->
  <ellipse cx="275" cy="420" rx="45" ry="24" fill="#F59E0B"/>
  <ellipse cx="275" cy="415" rx="36" ry="16" fill="url(#foodGrad)"/>
</svg>
